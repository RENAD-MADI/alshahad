<body data-page="quote">

  <div id="header-placeholder"></div>

  <!-- ===================== PAGE HERO ===================== -->
  <section class="hero page-hero" style="min-height:46vh">
    <div class="hero-bg" style="background-image:url('imoges/imoge16.jpg')"></div>
    <div class="hero-blob b1"></div>
    <div class="hero-blob b2"></div>
    <div class="container hero-content">
      <div class="breadcrumb">
        <a href="index.html" data-i18n="nav.home"></a>
        <span class="sep">/</span>
        <span data-i18n="nav.quote"></span>
      </div>
      <h1 data-aos="up" data-i18n="quote.hero.title"></h1>
      <p data-aos="up" data-aos-delay="100" data-i18n="quote.hero.subtitle"></p>
    </div>
  </section>

  <!-- ===================== FORM ===================== -->
  <section class="section-pad">
    <div class="container">
      <div style="display:grid; grid-template-columns:2fr 1fr; gap:40px; align-items:start;" class="quote-layout">
        <div class="form-card" data-aos="up">
          <span class="eyebrow" data-i18n="quote.form.eyebrow"></span>
          <h2 class="section-title" style="margin-top:10px" data-i18n="quote.form.title"></h2>
          <p class="section-desc" style="margin-bottom:30px" data-i18n="quote.form.desc"></p>

          <form data-ajax-form>
            <div class="form-group full" style="margin-bottom:24px">
              <label data-i18n="quote.form.serviceLabel"></label>
              <div class="radio-group">
                <label class="radio-card">
                  <input type="radio" name="service" value="contracting" checked>
                  <span data-i18n="quote.form.s1"></span>
                </label>
                <label class="radio-card">
                  <input type="radio" name="service" value="realestate">
                  <span data-i18n="quote.form.s2"></span>
                </label>
                <label class="radio-card">
                  <input type="radio" name="service" value="marketing">
                  <span data-i18n="quote.form.s3"></span>
                </label>
                <label class="radio-card">
                  <input type="radio" name="service" value="other">
                  <span data-i18n="quote.form.s4"></span>
                </label>
              </div>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label data-i18n="quote.form.nameLabel"></label>
                <input type="text" name="name" required data-i18n-placeholder="quote.form.namePh">
              </div>
              <div class="form-group">
                <label data-i18n="quote.form.phoneLabel"></label>
                <input type="tel" name="phone" required data-i18n-placeholder="quote.form.phonePh">
              </div>
              <div class="form-group">
                <label data-i18n="quote.form.emailLabel"></label>
                <input type="email" name="email" required data-i18n-placeholder="quote.form.emailPh">
              </div>
              <div class="form-group">
                <label data-i18n="quote.form.cityLabel"></label>
                <input type="text" name="city" data-i18n-placeholder="quote.form.cityPh">
              </div>
              <div class="form-group">
                <label data-i18n="quote.form.budgetLabel"></label>
                <input type="text" name="budget" data-i18n-placeholder="quote.form.budgetPh">
              </div>
              <div class="form-group">
                <label data-i18n="quote.form.timelineLabel"></label>
                <input type="text" name="timeline" data-i18n-placeholder="quote.form.timelinePh">
              </div>
              <div class="form-group full">
                <label data-i18n="quote.form.detailsLabel"></label>
                <textarea name="details" data-i18n-placeholder="quote.form.detailsPh"></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:24px; width:100%; justify-content:center;">
              <span data-i18n="quote.form.submit"></span><span class="icon-inline" data-icon="send"></span>
            </button>

            <div class="form-note" style="margin-top:24px">
              <span class="ic" data-icon="document" style="flex-shrink:0; width:24px; height:24px;"></span>
              <span data-i18n="quote.form.note"></span>
            </div>
          </form>

          <div class="form-success">
            <div class="ic" data-icon="check"></div>
            <h3 data-i18n="quote.form.successTitle"></h3>
            <p class="section-desc" data-i18n="quote.form.successDesc"></p>
            <a href="index.html" class="btn btn-primary" style="margin-top:20px"><span data-i18n="quote.form.successBtn"></span></a>
          </div>
        </div>

        <div data-aos="up" data-aos-delay="150">
          <span class="eyebrow" data-i18n="quote.info.eyebrow"></span>
          <h3 class="section-title" style="margin-top:10px; font-size:1.6rem" data-i18n="quote.info.title"></h3>
          <p class="section-desc" style="margin-bottom:24px" data-i18n="quote.info.desc"></p>

          <div style="display:flex; flex-direction:column; gap:18px;">
            <div class="contact-info-card">
              <div class="ic" data-icon="phone"></div>
              <div>
                <h4 data-i18n="quote.info.c1t"></h4>
                <a href="tel:0555881098" style="display:block">0555881098</a>
                <a href="tel:0550783385" style="display:block">0550783385</a>
              </div>
            </div>
            <div class="contact-info-card">
              <div class="ic" data-icon="mail"></div>
              <div>
                <h4 data-i18n="quote.info.c2t"></h4>
                <a href="mailto:Alshahad.ezz@gmail.com">Alshahad.ezz@gmail.com</a>
              </div>
            </div>
            <div class="contact-info-card">
              <div class="ic" data-icon="whatsapp"></div>
              <div>
                <h4 data-i18n="quote.info.c3t"></h4>
                <a href="https://wa.me/966550783385" target="_blank" rel="noopener noreferrer">0550783385</a>
              </div>
            </div>
            <div class="contact-info-card">
              <div class="ic" data-icon="clock"></div>
              <div>
                <h4 data-i18n="quote.info.c4t"></h4>
                <p data-i18n="quote.info.c4d"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
