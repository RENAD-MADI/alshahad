<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا | بحر الشهد - AL SHAHAD SAE COMMERCIAL</title>
  <meta name="description" content="تواصل مع شركة بحر الشهد عبر الهاتف، البريد الإلكتروني، واتساب، أو من خلال نموذج التواصل.">
  <meta name="author" content="AL SHAHAD SAE COMMERCIAL">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#4B2EFF">
  <link rel="canonical" href="https://alshahad.sa/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="تواصل معنا | بحر الشهد">
  <meta property="og:description" content="تواصل معنا عبر الهاتف، البريد، واتساب، أو نموذج التواصل.">
  <meta property="og:image" content="imoges/logo.jpeg">
  <meta property="og:locale" content="ar_SA">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="imoges/logo.jpeg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

  <div id="header-placeholder"></div>

  <!-- ===================== PAGE HERO ===================== -->
  <section class="hero page-hero" style="min-height:46vh">
    <div class="hero-bg" style="background-image:url('imoges/imoge17.jpg')"></div>
    <div class="hero-blob b1"></div>
    <div class="hero-blob b2"></div>
    <div class="container hero-content">
      <div class="breadcrumb">
        <a href="index.html" data-i18n="nav.home"></a>
        <span class="sep">/</span>
        <span data-i18n="nav.contact"></span>
      </div>
      <h1 data-aos="up" data-i18n="contact.hero.title"></h1>
      <p data-aos="up" data-aos-delay="100" data-i18n="contact.hero.subtitle"></p>
    </div>
  </section>

  <!-- ===================== CONTACT INFO + FORM ===================== -->
  <section class="section-pad">
    <div class="container">
      <div class="contact-grid">
        <div data-aos="right">
          <span class="eyebrow" data-i18n="contact.info.eyebrow"></span>
          <h2 class="section-title" data-i18n="contact.info.title"></h2>
          <p class="section-desc" style="margin-bottom:24px" data-i18n="contact.info.desc"></p>

          <div class="contact-info-list">
            <div class="contact-info-card">
              <div class="ic" data-icon="phone"></div>
              <div>
                <h4 data-i18n="contact.info.c1t"></h4>
                <a href="tel:0555881098" style="display:block">0555881098</a>
                <a href="tel:0550783385" style="display:block">0550783385</a>
              </div>
            </div>
            <div class="contact-info-card">
              <div class="ic" data-icon="mail"></div>
              <div>
                <h4 data-i18n="contact.info.c2t"></h4>
                <a href="mailto:Alshahad.ezz@gmail.com">Alshahad.ezz@gmail.com</a>
              </div>
            </div>
            <div class="contact-info-card">
              <div class="ic" data-icon="whatsapp"></div>
              <div>
                <h4 data-i18n="contact.info.c3t"></h4>
                <a href="https://wa.me/966550783385" target="_blank" rel="noopener noreferrer">0550783385</a>
              </div>
            </div>
            <div class="contact-info-card">
              <div class="ic" data-icon="pin"></div>
              <div>
                <h4 data-i18n="contact.info.c4t"></h4>
                <p data-i18n="contact.info.c4d"></p>
              </div>
            </div>
            <div class="contact-info-card">
              <div class="ic" data-icon="clock"></div>
              <div>
                <h4 data-i18n="contact.info.c5t"></h4>
                <p data-i18n="contact.info.c5d"></p>
              </div>
            </div>
          </div>
        </div>

        <div class="form-card" data-aos="left">
          <span class="eyebrow" data-i18n="contact.form.eyebrow"></span>
          <h2 class="section-title" style="margin-top:10px; margin-bottom:24px" data-i18n="contact.form.title"></h2>

          <form data-ajax-form>
            <div class="form-grid">
              <div class="form-group">
                <label data-i18n="contact.form.nameLabel"></label>
                <input type="text" name="name" required data-i18n-placeholder="contact.form.namePh">
              </div>
              <div class="form-group">
                <label data-i18n="contact.form.phoneLabel"></label>
                <input type="tel" name="phone" required data-i18n-placeholder="contact.form.phonePh">
              </div>
              <div class="form-group">
                <label data-i18n="contact.form.emailLabel"></label>
                <input type="email" name="email" required data-i18n-placeholder="contact.form.emailPh">
              </div>
              <div class="form-group">
                <label data-i18n="contact.form.subjectLabel"></label>
                <input type="text" name="subject" data-i18n-placeholder="contact.form.subjectPh">
              </div>
              <div class="form-group full">
                <label data-i18n="contact.form.messageLabel"></label>
                <textarea name="message" required data-i18n-placeholder="contact.form.messagePh"></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:24px; width:100%; justify-content:center;">
              <span data-i18n="contact.form.submit"></span><span class="icon-inline" data-icon="send"></span>
            </button>
          </form>

          <div class="form-success">
            <div class="ic" data-icon="check"></div>
            <h3 data-i18n="contact.form.successTitle"></h3>
            <p class="section-desc" data-i18n="contact.form.successDesc"></p>
            <a href="index.html" class="btn btn-primary" style="margin-top:20px"><span data-i18n="contact.form.successBtn"></span></a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="js/icons.js"></script>
  <script src="js/i18n-contact.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
